<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Generator — CommBridge</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

h1 {
    font-size: 48px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.main-grid {
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 30px;
    margin-top: 30px;
}

.panel {
    background: #f8f9fa;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 20px;
}

.panel-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 15px;
    color: #333;
}

textarea {
    width: 100%;
    padding: 15px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    resize: vertical;
    font-family: inherit;
}

textarea:focus {
    outline: none;
    border-color: #667eea;
}

.generate-btn {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
}

.generate-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
}

.generate-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.image-container {
    background: #f8f9fa;
    border-radius: 15px;
    padding: 20px;
    min-height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

#resultImage {
    max-width: 100%;
    max-height: 500px;
    border-radius: 10px;
    display: none;
}

.loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    display: none;
}

.loading.active {
    display: block;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #667eea;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.image-placeholder {
    text-align: center;
    color: #999;
}

.image-placeholder .icon {
    font-size: 80px;
    margin-bottom: 20px;
}

.status {
    margin-top: 15px;
    padding: 10px;
    background: white;
    border-radius: 8px;
    font-size: 14px;
    color: #666;
}

.error {
    color: #e74c3c;
    padding: 15px;
    background: #fee;
    border-radius: 8px;
    margin-top: 15px;
    display: none;
}

.error.show {
    display: block;
}

.download-btn {
    padding: 10px 20px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
    width: 100%;
}

.download-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
</style>
</head>
<body>
<div class="container">
    <h1>🎨 AI Image Generator</h1>
    <p style="color: #666;">Generate beautiful images from text descriptions</p>
    
    <div class="main-grid">
        <div>
            <div class="panel">
                <div class="panel-title">📝 Describe your image</div>
                <textarea id="promptInput" rows="4" placeholder="A beautiful sunset over mountains with golden light..."></textarea>
            </div>
            
            <button class="generate-btn" id="generateBtn" onclick="generateImage()">
                ✨ Generate Image
            </button>
            
            <div class="status" id="status">
                Ready to generate
            </div>
            
            <div class="error" id="errorMsg"></div>
        </div>
        
        <div>
            <div class="image-container">
                <div class="image-placeholder" id="placeholder">
                    <div class="icon">🖼️</div>
                    <p>Your generated image will appear here</p>
                </div>
                <img id="resultImage" alt="Generated Image" crossorigin="anonymous">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Generating your image...</p>
                </div>
            </div>
            
            <button class="download-btn" id="downloadBtn" onclick="downloadImage()" disabled>
                ⬇️ Download Image
            </button>
        </div>
    </div>
</div>

<script>
const API_URL = 'https://image.sarafathima3700.workers.dev';
const API_KEY = '12345678';

let currentImageBlob = null;

async function generateImage() {
    const prompt = document.getElementById('promptInput').value.trim();
    
    if (!prompt) {
        showError('Please enter a prompt');
        return;
    }
    
    // Show loading state
    document.getElementById('generateBtn').disabled = true;
    document.getElementById('loading').classList.add('active');
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('resultImage').style.display = 'none';
    document.getElementById('errorMsg').classList.remove('show');
    document.getElementById('status').textContent = 'Generating image...';
    
    try {
        console.log('Sending request to:', API_URL);
        console.log('Prompt:', prompt);
        
        const response = await fetch(API_URL, {
            method: 'POST',
            mode: 'cors',
            headers: {
                'Authorization': `Bearer ${API_KEY}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ prompt: prompt })
        });
        
        console.log('Response status:', response.status);
        
        if (!response.ok) {
            const errorText = await response.text();
            console.error('Error response:', errorText);
            throw new Error(`API Error ${response.status}: ${errorText}`);
        }
        
        // Get the image as blob
        const blob = await response.blob();
        console.log('Image received, size:', blob.size, 'bytes');
        
        // Display the image
        const url = URL.createObjectURL(blob);
        const img = document.getElementById('resultImage');
        img.src = url;
        img.style.display = 'block';
        
        currentImageBlob = blob;
        document.getElementById('downloadBtn').disabled = false;
        document.getElementById('status').textContent = '✅ Image generated successfully!';
        
    } catch (error) {
        console.error('Error details:', error);
        
        let errorMessage = error.message;
        if (error.message.includes('Failed to fetch') || error.message.includes('CORS')) {
            errorMessage = 'CORS Error: Update your Cloudflare Worker with CORS headers. See console for details.';
        } else if (error.message.includes('NetworkError')) {
            errorMessage = 'Network Error: Check your internet connection.';
        }
        
        showError(errorMessage);
        document.getElementById('status').textContent = '❌ Generation failed';
        document.getElementById('placeholder').style.display = 'block';
        
    } finally {
        document.getElementById('loading').classList.remove('active');
        document.getElementById('generateBtn').disabled = false;
    }
}

function downloadImage() {
    if (!currentImageBlob) return;
    
    const url = URL.createObjectURL(currentImageBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ai-image-${Date.now()}.jpg`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function showError(message) {
    const errorDiv = document.getElementById('errorMsg');
    errorDiv.textContent = '❌ ' + message;
    errorDiv.classList.add('show');
    console.error(message);
}

// Test the connection on page load
async function testConnection() {
    try {
        console.log('Testing connection to Worker...');
        const response = await fetch(API_URL, {
            method: 'OPTIONS',
            mode: 'cors'
        });
        console.log('OPTIONS response:', response.status, response.headers);
    } catch (error) {
        console.log('Connection test error:', error);
    }
}

// Add keyboard shortcut
document.getElementById('promptInput').addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') {
        generateImage();
    }
});

// Test connection on load
window.addEventListener('load', testConnection);
</script>
</body>
</html>
