<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Word Recognition — CommBridge | 3D Blue/White ASL</title>

<!-- Google Fonts & Base Styles -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style><link rel="stylesheet" href="/static/base.css">
</head>
<body>

<div class="cursor"></div>
<div class="cursor-ring"></div>
<canvas id="bg-canvas-3d"></canvas>

<nav>
  <div class="nav-logo">⟡ CommBridge</div>
  <div class="nav-links">
    <a href="#" class="nav-link active">Words</a>
    <a href="#" class="nav-link">Letters</a>
    <a href="#" class="nav-link">Numbers</a>
    <a href="#" class="nav-link">TTS</a>
    <a href="#" class="nav-link">STT</a>
    <a href="#" class="nav-link">Games</a>
    <a href="#" class="nav-link">AI Art</a>
  </div>
</nav>

<div class="main-layout">
  <div class="page-header">
    <span class="section-label">✦ ASL RECOGNITION ENGINE</span>
    <h1>Word Recognition</h1>
    <p style="color: var(--text-muted); margin-top: 6px;">Sign words using ASL — real-time detection. Words build into sentences automatically.</p>
  </div>

  <div class="detection-layout">
    <!-- Camera Panel -->
    <div class="camera-panel">
      <div class="cam-box">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay-canvas"></canvas>
        <div id="no-cam" style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(255,255,255,0.9); backdrop-filter:blur(4px); border-radius:32px;">
          <div style="font-size:48px">📷</div>
          <p style="color:var(--text-muted);">Camera not started</p>
          <button class="btn btn-primary" onclick="startCam()">Enable Camera</button>
        </div>
      </div>
      <div class="cam-controls">
        <button class="btn btn-primary" id="start-btn" onclick="startCam()">▶ Start</button>
        <button class="btn btn-secondary" id="stop-btn" onclick="stopCam()" disabled>■ Stop</button>
        <button class="btn btn-ghost" onclick="addSpace()">⎵ Space</button>
        <button class="btn btn-ghost" onclick="clearSentence()">Clear</button>
        <button class="btn btn-success" onclick="speakSentence()">🔊 Speak</button>
      </div>
      <div class="status-bar">
        <div class="status-dot" id="status-dot" style="background: #94a3b8;"></div>
        <span id="status-text">Camera offline</span>
        <span style="flex:1"></span>
        <span style="font-family:monospace; font-size:11px;">⚡ 3D Vision Ready</span>
      </div>
    </div>

    <!-- Right Column -->
    <div class="result-panel">
      <div class="detected-word">
        <div class="detected-label">✨ CURRENT SIGN DETECTION</div>
        <div class="detected-value" id="detected-word">—</div>
        <div class="conf-display">
          <div style="display:flex; justify-content:space-between; font-size:11px;">
            <span>CONFIDENCE</span><span id="conf-pct">0%</span>
          </div>
          <div class="conf-bar"><div class="conf-fill" id="conf-fill"></div></div>
        </div>
      </div>

      <div class="sentence-panel">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
          <span style="font-family:monospace; font-size:11px; letter-spacing:1px;">📝 SENTENCE BUILDER</span>
          <button class="btn btn-sm btn-ghost" onclick="copySentence()">Copy</button>
        </div>
        <div class="sentence-output" id="sentence-out"></div>
      </div>

      <div class="asl-ref">
        <div style="font-family:monospace; font-size:11px;">📖 COMMON ASL SIGNS</div>
        <div class="ref-grid" id="ref-grid"></div>
      </div>

      <div class="activity-log">
        <div style="font-family:monospace; font-size:11px;">🕒 RECENT LOGS</div>
        <div id="log-items"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // ---------- 3D Animated Background (Blue/White abstract waves) ----------
  const canvas3d = document.getElementById('bg-canvas-3d');
  let scene, camera, renderer, particles;
  function init3DBg() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 20;
    renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    const particleCount = 1800;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      positions[i*3] = (Math.random() - 0.5) * 60;
      positions[i*3+1] = (Math.random() - 0.5) * 40;
      positions[i*3+2] = (Math.random() - 0.5) * 30 - 15;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({
      color: 0x3b82f6,
      size: 0.12,
      transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending
    });
    particles = new THREE.Points(geometry, material);
    scene.add(particles);
    
    const secondLayer = new THREE.Points(
      new THREE.BufferGeometry(),
      new THREE.PointsMaterial({ color: 0x60a5fa, size: 0.08, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending })
    );
    const pos2 = new Float32Array(1200 * 3);
    for (let i=0;i<1200;i++) {
      pos2[i*3] = (Math.random() - 0.5) * 80;
      pos2[i*3+1] = (Math.random() - 0.5) * 50;
      pos2[i*3+2] = (Math.random() - 0.5) * 40;
    }
    secondLayer.geometry.setAttribute('position', new THREE.BufferAttribute(pos2, 3));
    scene.add(secondLayer);
    
    const ambient = new THREE.AmbientLight(0xffffff);
    scene.add(ambient);
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.003;
      particles.rotation.y = time * 0.2;
      particles.rotation.x = Math.sin(time * 0.1) * 0.1;
      secondLayer.rotation.z = time * 0.15;
      secondLayer.rotation.x = time * 0.1;
      renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }
  if (typeof THREE !== 'undefined') init3DBg(); else {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    script.onload = init3DBg;
    document.head.appendChild(script);
  }

  // ----- Cursor effect -----
  const cursorDot = document.querySelector('.cursor');
  const cursorRing = document.querySelector('.cursor-ring');
  document.addEventListener('mousemove', (e) => {
    cursorDot.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    cursorRing.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
  });
  document.addEventListener('mousedown', () => { cursorRing.style.width = '20px'; cursorRing.style.height = '20px'; });
  document.addEventListener('mouseup', () => { cursorRing.style.width = '40px'; cursorRing.style.height = '40px'; });

  // ---------- ASL Reference ----------
  const ASL_WORDS = [
    { emoji: '👋', label: 'Hello' }, { emoji: '🙏', label: 'Thank you' }, { emoji: '✌️', label: 'Peace' },
    { emoji: '👍', label: 'Good' }, { emoji: '❤️', label: 'Love' }, { emoji: '🤟', label: 'I love you' },
    { emoji: '✋', label: 'Stop' }, { emoji: '👌', label: 'OK' }, { emoji: '🤙', label: 'Call me' },
    { emoji: '👈', label: 'Here' }, { emoji: '🙌', label: 'Yes' }, { emoji: '🤞', label: 'Help' }
  ];
  const refGrid = document.getElementById('ref-grid');
  ASL_WORDS.forEach(w => {
    refGrid.innerHTML += `<div class="ref-item"><span class="ref-emoji">${w.emoji}</span>${w.label}</div>`;
  });

  // ---------- Webcam & Detection State ----------
  let stream = null;
  let detecting = false;
  let sentence = '';
  let detectionInterval = null;
  const video = document.getElementById('video');
  const noCamDiv = document.getElementById('no-cam');
  const startBtn = document.getElementById('start-btn');
  const stopBtn = document.getElementById('stop-btn');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');

  // Toast helper (simple)
  const Toast = { info: (msg) => alert(msg), success: (msg) => console.log(msg) };

  async function startWebcam() {
    try {
      const mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = mediaStream;
      stream = mediaStream;
      await video.play();
      return true;
    } catch(err) {
      console.warn(err);
      Toast.info('Camera access denied or error');
      return false;
    }
  }

  async function startCam() {
    const ok = await startWebcam();
    if (!ok) return;
    noCamDiv.style.display = 'none';
    startBtn.disabled = true;
    stopBtn.disabled = false;
    statusDot.style.background = '#10b981';
    statusDot.style.boxShadow = '0 0 10px #10b981';
    statusText.textContent = 'Detecting...';
    detecting = true;
    startDetectionLoop();
  }

  function stopCam() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
    detecting = false;
    if (detectionInterval) clearInterval(detectionInterval);
    video.srcObject = null;
    noCamDiv.style.display = 'flex';
    startBtn.disabled = false;
    stopBtn.disabled = true;
    statusDot.style.background = '#94a3b8';
    statusDot.style.boxShadow = 'none';
    statusText.textContent = 'Camera offline';
  }

  // smart mock detection (with realistic confidence)
  const DEMO_WORDS = ['Hello', 'Thank you', 'Love', 'Good', 'Yes', 'Help', 'Please', 'Sorry', 'Peace', 'Stop'];
  let lastWordDetected = '';
  let lastDetectionTimestamp = 0;
  
  function simulateDetection() {
    if (!detecting) return;
    const word = DEMO_WORDS[Math.floor(Math.random() * DEMO_WORDS.length)];
    const conf = 0.68 + Math.random() * 0.28;
    updateDetectionUI({ word, confidence: conf, detected: true });
  }

  // Real endpoint or mock
  async function captureAndDetect() {
    if (!video.videoWidth || !detecting) return;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
    const fd = new FormData();
    fd.append('frame', blob, 'frame.jpg');
    try {
      const res = await fetch('/api/word-recognition', { method: 'POST', body: fd });
      if (res.ok) {
        const data = await res.json();
        updateDetectionUI(data);
        return;
      } else throw new Error();
    } catch(e) {
      simulateDetection();
    }
  }

  function updateDetectionUI(data) {
    if (!data.detected && !data.word) return;
    let word = data.word || '—';
    let conf = data.confidence || 0;
    if (word === '—') return;
    document.getElementById('detected-word').textContent = word;
    document.getElementById('conf-pct').textContent = `${Math.round(conf * 100)}%`;
    const fillEl = document.getElementById('conf-fill');
    fillEl.style.width = `${conf * 100}%`;
    // add to sentence with debounce (1.2s cooldown)
    const now = Date.now();
    if (word !== '—' && word !== lastWordDetected && (now - lastDetectionTimestamp > 1200)) {
      sentence += (sentence ? ' ' : '') + word;
      document.getElementById('sentence-out').textContent = sentence;
      lastWordDetected = word;
      lastDetectionTimestamp = now;
      addLogEntry(word, conf);
    }
  }

  function addLogEntry(word, confidence) {
    const logContainer = document.getElementById('log-items');
    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute:'2-digit', second:'2-digit' });
    let badgeClass = 'badge-accent';
    if (confidence > 0.85) badgeClass = 'badge-success';
    else if (confidence < 0.65) badgeClass = 'badge-warn';
    const logHtml = `<div class="log-item">
      <span class="log-time" style="font-family:monospace; font-size:10px;">${timeStr}</span>
      <span style="flex:1; font-weight:500;">${word}</span>
      <span class="badge ${badgeClass}">${Math.round(confidence*100)}%</span>
    </div>`;
    logContainer.insertAdjacentHTML('afterbegin', logHtml);
    if (logContainer.children.length > 18) logContainer.removeChild(logContainer.lastChild);
  }

  function startDetectionLoop() {
    if (detectionInterval) clearInterval(detectionInterval);
    detectionInterval = setInterval(() => {
      if (detecting && video.videoWidth > 0) {
        captureAndDetect();
      } else if (detecting && !video.videoWidth) {
        // still waiting for cam frames
      }
    }, 980);
  }

  function addSpace() { sentence += ' '; document.getElementById('sentence-out').textContent = sentence; }
  function clearSentence() { sentence = ''; document.getElementById('sentence-out').textContent = ''; lastWordDetected = ''; }
  function speakSentence() { if (sentence.trim()) { const utter = new SpeechSynthesisUtterance(sentence); speechSynthesis.speak(utter); Toast.success('🔊 Speaking sentence'); } else Toast.info('No sentence yet'); }
  function copySentence() { const text = document.getElementById('sentence-out').innerText; if(text) { navigator.clipboard.writeText(text); Toast.success('Copied!'); } }

  window.startCam = startCam;
  window.stopCam = stopCam;
  window.addSpace = addSpace;
  window.clearSentence = clearSentence;
  window.speakSentence = speakSentence;
  window.copySentence = copySentence;

  // init overlay canvas dummy
  const overlay = document.getElementById('overlay-canvas');
  if(overlay) overlay.getContext('2d');
</script>
</body>
</html>
