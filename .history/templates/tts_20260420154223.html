<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Text to Speech — CommuniSense</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg-dark: #0a0a0f;
        --bg-card: rgba(15, 15, 25, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-border-light: rgba(255, 255, 255, 0.15);
        --accent: #6366f1;
        --accent2: #8b5cf6;
        --accent3: #06b6d4;
        --success: #10b981;
        --danger: #ef4444;
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.7);
        --text-muted: rgba(255, 255, 255, 0.4);
        --font-display: 'Inter', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg-dark);
        color: var(--text-primary);
        overflow-x: hidden;
    }

    #bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
    }

    .glass-nav {
        position: fixed;
        top: 20px;
        left: 20px;
        right: 20px;
        z-index: 100;
        background: rgba(10, 10, 15, 0.7);
        backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 12px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .nav-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.3rem;
        font-weight: 700;
        color: white;
        text-decoration: none;
    }

    .dot {
        width: 10px;
        height: 10px;
        background: var(--accent);
        border-radius: 50%;
    }

    .nav-links {
        display: flex;
        gap: 32px;
    }

    .nav-link {
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        transition: color 0.2s;
    }

    .nav-link:hover, .nav-link.active {
        color: white;
    }

    .main-layout {
        padding: 100px 40px 60px;
        max-width: 1200px;
        margin: 0 auto;
    }

    .section-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--accent);
        background: rgba(99, 102, 241, 0.1);
        padding: 4px 12px;
        border-radius: 20px;
        display: inline-block;
        margin-bottom: 16px;
    }

    .tts-grid {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 24px;
    }

    .panel {
        background: var(--bg-card);
        backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        overflow: hidden;
    }

    .panel-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--glass-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .panel-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
    }

    .panel-body {
        padding: 20px;
    }

    .big-textarea {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        padding: 20px;
        color: white;
        font-size: 18px;
        line-height: 1.6;
        outline: none;
        resize: vertical;
        font-family: inherit;
    }

    .big-textarea:focus {
        border-color: var(--accent);
    }

    .btn {
        padding: 10px 20px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
    }

    .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: white;
    }

    .btn-ghost {
        background: transparent;
        border: 1px solid var(--glass-border);
        color: var(--text-secondary);
    }

    .btn-ghost:hover {
        border-color: var(--glass-border-light);
        color: white;
    }

    .btn-full {
        width: 100%;
    }

    .badge {
        font-size: 10px;
        padding: 4px 10px;
        border-radius: 20px;
        background: rgba(99, 102, 241, 0.2);
        color: var(--accent);
    }

    .lang-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        max-height: 280px;
        overflow-y: auto;
    }

    .lang-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        padding: 10px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
    }

    .lang-card:hover {
        border-color: var(--glass-border-light);
        background: rgba(99, 102, 241, 0.1);
    }

    .lang-card.selected {
        border-color: var(--accent);
        background: rgba(99, 102, 241, 0.15);
    }

    .lang-flag {
        font-size: 18px;
    }

    .speak-btn {
        width: 100%;
        height: 56px;
        font-size: 16px;
        font-weight: 600;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border: none;
        border-radius: 14px;
        color: white;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 16px;
    }

    .speak-btn:hover {
        transform: translateY(-2px);
    }

    .phrase-bank {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .phrase-tag {
        padding: 6px 14px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .phrase-tag:hover {
        border-color: var(--accent);
        background: rgba(99, 102, 241, 0.1);
    }

    .char-count {
        font-size: 11px;
        color: var(--text-muted);
        text-align: right;
        margin-top: 8px;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        transition: all 0.3s;
    }

    .status-active {
        background: var(--success);
        box-shadow: 0 0 8px var(--success);
        animation: pulse 2s infinite;
    }

    .status-loading {
        background: var(--warning);
        animation: pulse 1s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.8); }
    }

    input[type="range"] {
        width: 100%;
        height: 4px;
        background: var(--glass-border);
        border-radius: 2px;
        -webkit-appearance: none;
    }

    input[type="range"]:focus {
        outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        background: var(--accent);
        border-radius: 50%;
        cursor: pointer;
    }

    @media (max-width: 900px) {
        .tts-grid {
            grid-template-columns: 1fr;
        }
        .main-layout {
            padding: 100px 20px 40px;
        }
        .nav-links {
            display: none;
        }
    }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<nav class="glass-nav">
    <a href="/dashboard" class="nav-logo">
        <div class="dot"></div>
        <span>CommuniSense</span>
    </a>
    <div class="nav-links">
        <a href="/word_recog" class="nav-link">Words</a>
        <a href="/letter_recog" class="nav-link">Letters</a>
        <a href="/number_recog" class="nav-link">Numbers</a>
        <a href="/tts" class="nav-link active">TTS</a>
        <a href="/stt" class="nav-link">STT</a>
        <a href="/games" class="nav-link">Games</a>
        <a href="/dashboard" class="nav-link">Home</a>
    </div>
</nav>

<div class="main-layout">
    <div style="margin-bottom: 40px">
        <span class="section-label">🔊 Voice Output</span>
        <h1 style="font-size: clamp(32px, 4vw, 52px); font-weight: 800;">Text to Speech</h1>
        <p style="color: var(--text-muted); margin-top: 8px;">Convert any text to speech in 50+ languages. Type or select a phrase below.</p>
    </div>

    <div class="tts-grid">
        <!-- Left Column -->
        <div>
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Enter Text</span>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn btn-ghost" onclick="clearText()">Clear</button>
                        <button class="btn btn-ghost" onclick="copyText()">Copy</button>
                    </div>
                </div>
                <div class="panel-body">
                    <textarea id="ttsInput" class="big-textarea" rows="5" placeholder="Type your message here..."></textarea>
                    <div class="char-count"><span id="charCount">0</span> characters</div>
                </div>
            </div>

            <div class="panel" style="margin-top: 16px;">
                <div class="panel-header">
                    <span class="panel-title">Quick Phrases</span>
                </div>
                <div class="panel-body">
                    <div class="phrase-bank" id="phraseBank"></div>
                </div>
            </div>
        </div>

        <!-- Right Column -->
        <div>
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Input Language (for Translation)</span>
                </div>
                <div class="panel-body">
                    <input type="text" id="searchInput" class="big-textarea" style="padding: 10px; font-size: 14px; margin-bottom: 12px;" placeholder="Search language...">
                    <div class="lang-grid" id="inputLangGrid"></div>
                </div>
            </div>

            <div class="panel" style="margin-top: 16px;">
                <div class="panel-header">
                    <span class="panel-title">Output Language (Speech)</span>
                </div>
                <div class="panel-body">
                    <input type="text" id="outputSearch" class="big-textarea" style="padding: 10px; font-size: 14px; margin-bottom: 12px;" placeholder="Search language...">
                    <div class="lang-grid" id="outputLangGrid"></div>
                </div>
            </div>

            <div class="panel" style="margin-top: 16px;">
                <div class="panel-header">
                    <span class="panel-title">Voice Settings</span>
                </div>
                <div class="panel-body">
                    <div style="margin-bottom: 16px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span>Rate</span>
                            <span id="rateValue">1.0x</span>
                        </div>
                        <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1">
                    </div>
                    <div style="margin-bottom: 16px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span>Pitch</span>
                            <span id="pitchValue">1.0</span>
                        </div>
                        <input type="range" id="pitchSlider" min="0.5" max="2" step="0.1" value="1">
                    </div>
                </div>
            </div>

            <button class="speak-btn" onclick="speakText()">
                🔊 Speak Now
            </button>
            <button class="speak-btn" style="margin-top: 12px; background: rgba(255,255,255,0.1);" onclick="stopSpeaking()">
                ■ Stop
            </button>

            <div style="display: flex; align-items: center; gap: 8px; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 12px; margin-top: 16px;">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText" style="font-size: 12px; color: var(--text-muted);">Ready</span>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('bg-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 15);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 1500;
    const posArray = new Float32Array(particlesCount * 3);
    
    for (let i = 0; i < particlesCount; i++) {
        posArray[i * 3] = (Math.random() - 0.5) * 40;
        posArray[i * 3 + 1] = (Math.random() - 0.5) * 30;
        posArray[i * 3 + 2] = (Math.random() - 0.5) * 30 - 15;
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMaterial = new THREE.PointsMaterial({ size: 0.06, color: 0x6366f1, transparent: true, opacity: 0.4 });
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);
    
    const ambientLight = new THREE.AmbientLight(0x404040);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
    directionalLight.position.set(5, 10, 7);
    scene.add(directionalLight);
    
    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.005;
        particlesMesh.rotation.y = time * 0.1;
        particlesMesh.rotation.x = Math.sin(time * 0.2) * 0.1;
        camera.position.x = Math.sin(time * 0.2) * 0.2;
        camera.position.y = Math.cos(time * 0.15) * 0.1;
        camera.lookAt(0, 0, -5);
        renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

<script>
    // 50+ Languages with their codes and flags
    const LANGUAGES = [
        { name: "English", code: "en", flag: "🇺🇸", ttsCode: "en-US" },
        { name: "Hindi", code: "hi", flag: "🇮🇳", ttsCode: "hi-IN" },
        { name: "Kannada", code: "kn", flag: "🇮🇳", ttsCode: "kn-IN" },
        { name: "Tamil", code: "ta", flag: "🇮🇳", ttsCode: "ta-IN" },
        { name: "Telugu", code: "te", flag: "🇮🇳", ttsCode: "te-IN" },
        { name: "Malayalam", code: "ml", flag: "🇮🇳", ttsCode: "ml-IN" },
        { name: "Marathi", code: "mr", flag: "🇮🇳", ttsCode: "mr-IN" },
        { name: "Gujarati", code: "gu", flag: "🇮🇳", ttsCode: "gu-IN" },
        { name: "Punjabi", code: "pa", flag: "🇮🇳", ttsCode: "pa-IN" },
        { name: "Bengali", code: "bn", flag: "🇧🇩", ttsCode: "bn-IN" },
        { name: "Urdu", code: "ur", flag: "🇵🇰", ttsCode: "ur-PK" },
        { name: "Spanish", code: "es", flag: "🇪🇸", ttsCode: "es-ES" },
        { name: "French", code: "fr", flag: "🇫🇷", ttsCode: "fr-FR" },
        { name: "German", code: "de", flag: "🇩🇪", ttsCode: "de-DE" },
        { name: "Italian", code: "it", flag: "🇮🇹", ttsCode: "it-IT" },
        { name: "Portuguese", code: "pt", flag: "🇵🇹", ttsCode: "pt-PT" },
        { name: "Russian", code: "ru", flag: "🇷🇺", ttsCode: "ru-RU" },
        { name: "Japanese", code: "ja", flag: "🇯🇵", ttsCode: "ja-JP" },
        { name: "Korean", code: "ko", flag: "🇰🇷", ttsCode: "ko-KR" },
        { name: "Chinese", code: "zh", flag: "🇨🇳", ttsCode: "zh-CN" },
        { name: "Arabic", code: "ar", flag: "🇸🇦", ttsCode: "ar-SA" },
        { name: "Turkish", code: "tr", flag: "🇹🇷", ttsCode: "tr-TR" },
        { name: "Dutch", code: "nl", flag: "🇳🇱", ttsCode: "nl-NL" },
        { name: "Polish", code: "pl", flag: "🇵🇱", ttsCode: "pl-PL" },
        { name: "Swedish", code: "sv", flag: "🇸🇪", ttsCode: "sv-SE" },
        { name: "Norwegian", code: "no", flag: "🇳🇴", ttsCode: "nb-NO" },
        { name: "Danish", code: "da", flag: "🇩🇰", ttsCode: "da-DK" },
        { name: "Finnish", code: "fi", flag: "🇫🇮", ttsCode: "fi-FI" },
        { name: "Greek", code: "el", flag: "🇬🇷", ttsCode: "el-GR" },
        { name: "Czech", code: "cs", flag: "🇨🇿", ttsCode: "cs-CZ" },
        { name: "Hungarian", code: "hu", flag: "🇭🇺", ttsCode: "hu-HU" },
        { name: "Romanian", code: "ro", flag: "🇷🇴", ttsCode: "ro-RO" },
        { name: "Ukrainian", code: "uk", flag: "🇺🇦", ttsCode: "uk-UA" },
        { name: "Hebrew", code: "he", flag: "🇮🇱", ttsCode: "he-IL" },
        { name: "Thai", code: "th", flag: "🇹🇭", ttsCode: "th-TH" },
        { name: "Vietnamese", code: "vi", flag: "🇻🇳", ttsCode: "vi-VN" },
        { name: "Indonesian", code: "id", flag: "🇮🇩", ttsCode: "id-ID" },
        { name: "Malay", code: "ms", flag: "🇲🇾", ttsCode: "ms-MY" },
        { name: "Swahili", code: "sw", flag: "🇰🇪", ttsCode: "sw-KE" },
        { name: "Afrikaans", code: "af", flag: "🇿🇦", ttsCode: "af-ZA" }
    ];

    let selectedInputLang = LANGUAGES[0];
    let selectedOutputLang = LANGUAGES[0];

    // Build language grids
    function buildLangGrid(containerId, languages, selectedLang, onSelect) {
        const container = document.getElementById(containerId);
        container.innerHTML = languages.map(lang => `
            <div class="lang-card ${selectedLang.code === lang.code ? 'selected' : ''}" onclick="onSelect('${lang.code}')">
                <span class="lang-flag">${lang.flag}</span>
                <span>${lang.name}</span>
            </div>
        `).join('');
    }

    window.onSelect = function(code) {
        const lang = LANGUAGES.find(l => l.code === code);
        if (lang) {
            selectedInputLang = lang;
            buildLangGrid('inputLangGrid', LANGUAGES, selectedInputLang, 'onSelect');
        }
    };

    window.onSelectOutput = function(code) {
        const lang = LANGUAGES.find(l => l.code === code);
        if (lang) {
            selectedOutputLang = lang;
            buildLangGrid('outputLangGrid', LANGUAGES, selectedOutputLang, 'onSelectOutput');
        }
    };

    // Search filters
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const filtered = LANGUAGES.filter(l => l.name.toLowerCase().includes(e.target.value.toLowerCase()));
        buildLangGrid('inputLangGrid', filtered, selectedInputLang, 'onSelect');
    });

    document.getElementById('outputSearch').addEventListener('input', (e) => {
        const filtered = LANGUAGES.filter(l => l.name.toLowerCase().includes(e.target.value.toLowerCase()));
        buildLangGrid('outputLangGrid', filtered, selectedOutputLang, 'onSelectOutput');
    });

    // Quick phrases
    const PHRASES = [
        "Hello, how are you?", "Thank you very much", "Please help me",
        "I need a doctor", "Can you speak slowly?", "I don't understand",
        "Where is the bathroom?", "Call emergency services", "Nice to meet you",
        "Goodbye, see you later", "I love you", "Have a great day!"
    ];

    const phraseBank = document.getElementById('phraseBank');
    PHRASES.forEach(phrase => {
        const tag = document.createElement('span');
        tag.className = 'phrase-tag';
        tag.textContent = phrase;
        tag.onclick = () => {
            document.getElementById('ttsInput').value = phrase;
            updateCharCount();
        };
        phraseBank.appendChild(tag);
    });

    function updateCharCount() {
        const text = document.getElementById('ttsInput').value;
        document.getElementById('charCount').textContent = text.length;
    }

    function clearText() {
        document.getElementById('ttsInput').value = '';
        updateCharCount();
    }

    function copyText() {
        const text = document.getElementById('ttsInput').value;
        if (text) {
            navigator.clipboard.writeText(text);
            showToast('Copied to clipboard!');
        }
    }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.textContent = msg;
        toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:white;padding:10px 20px;border-radius:10px;z-index:1000;font-size:14px;';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    async function speakText() {
        let text = document.getElementById('ttsInput').value.trim();
        if (!text) {
            showToast('Please enter some text');
            return;
        }

        const rate = parseFloat(document.getElementById('rateSlider').value);
        const pitch = parseFloat(document.getElementById('pitchSlider').value);

        setStatus('Translating...', 'loading');

        // Translate if input language is different from output language
        if (selectedInputLang.code !== selectedOutputLang.code) {
            try {
                const translateRes = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        src: selectedInputLang.code,
                        dest: selectedOutputLang.code
                    })
                });
                const translateData = await translateRes.json();
                if (translateData.translated) {
                    text = translateData.translated;
                }
            } catch (err) {
                console.error('Translation error:', err);
            }
        }

        setStatus('Speaking...', 'loading');

        try {
            const res = await fetch('/api/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, lang: selectedOutputLang.code })
            });

            if (res.ok) {
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                audio.playbackRate = rate;
                audio.play();
                audio.onended = () => {
                    setStatus('Ready', 'active');
                    URL.revokeObjectURL(url);
                };
                audio.onerror = () => {
                    setStatus('Error', 'error');
                    showToast('Error playing audio');
                };
            } else {
                throw new Error('Server TTS failed');
            }
        } catch (err) {
            // Fallback to browser TTS
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = selectedOutputLang.ttsCode || selectedOutputLang.code;
            utterance.rate = rate;
            utterance.pitch = pitch;
            utterance.onend = () => setStatus('Ready', 'active');
            utterance.onerror = () => {
                setStatus('Error', 'error');
                showToast('TTS error');
            };
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
    }

    function stopSpeaking() {
        window.speechSynthesis.cancel();
        setStatus('Stopped', 'active');
    }

    function setStatus(msg, type) {
        document.getElementById('statusText').textContent = msg;
        const dot = document.getElementById('statusDot');
        dot.className = 'status-dot';
        if (type === 'active') dot.classList.add('status-active');
        else if (type === 'loading') dot.classList.add('status-loading');
    }

    // Slider displays
    document.getElementById('rateSlider').addEventListener('input', (e) => {
        document.getElementById('rateValue').textContent = e.target.value + 'x';
    });
    document.getElementById('pitchSlider').addEventListener('input', (e) => {
        document.getElementById('pitchValue').textContent = e.target.value;
    });

    document.getElementById('ttsInput').addEventListener('input', updateCharCount);

    // Initialize
    buildLangGrid('inputLangGrid', LANGUAGES, selectedInputLang, 'onSelect');
    buildLangGrid('outputLangGrid', LANGUAGES, selectedOutputLang, 'onSelectOutput');
    updateCharCount();
    setStatus('Ready', 'active');
</script>
</body>
</html>
