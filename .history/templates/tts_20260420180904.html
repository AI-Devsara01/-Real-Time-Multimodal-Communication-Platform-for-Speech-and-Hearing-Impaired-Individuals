<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Text to Speech — CommuniSense (Instant)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg-dark: #0a0a0f;
        --bg-card: rgba(15, 15, 25, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-border-light: rgba(255, 255, 255, 0.15);
        --accent: #6366f1;
        --accent2: #8b5cf6;
        --success: #10b981;
        --danger: #ef4444;
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.7);
        --text-muted: rgba(255, 255, 255, 0.4);
    }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg-dark);
        color: var(--text-primary);
        overflow-x: hidden;
    }

    #bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
    }

    .glass-nav {
        position: fixed;
        top: 20px;
        left: 20px;
        right: 20px;
        z-index: 100;
        background: rgba(10, 10, 15, 0.7);
        backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 12px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .nav-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.3rem;
        font-weight: 700;
        color: white;
        text-decoration: none;
    }

    .dot {
        width: 10px;
        height: 10px;
        background: var(--accent);
        border-radius: 50%;
    }

    .nav-links {
        display: flex;
        gap: 32px;
        flex-wrap: wrap;
    }

    .nav-link {
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        transition: color 0.2s;
    }

    .nav-link:hover, .nav-link.active {
        color: white;
    }

    .main-layout {
        padding: 100px 40px 60px;
        max-width: 1400px;
        margin: 0 auto;
    }

    .section-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--accent);
        background: rgba(99, 102, 241, 0.1);
        padding: 4px 12px;
        border-radius: 20px;
        display: inline-block;
        margin-bottom: 16px;
    }

    .tts-grid {
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 24px;
    }

    .panel {
        background: var(--bg-card);
        backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        overflow: hidden;
    }

    .panel-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--glass-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .panel-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
    }

    .panel-body {
        padding: 20px;
    }

    .big-textarea {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        padding: 20px;
        color: white;
        font-size: 18px;
        line-height: 1.6;
        outline: none;
        resize: vertical;
        font-family: inherit;
    }

    .big-textarea:focus {
        border-color: var(--accent);
    }

    .btn {
        padding: 10px 20px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
    }

    .btn-ghost {
        background: transparent;
        border: 1px solid var(--glass-border);
        color: var(--text-secondary);
    }

    .btn-ghost:hover {
        border-color: var(--glass-border-light);
        color: white;
    }

    .speak-btn {
        width: 100%;
        height: 56px;
        font-size: 16px;
        font-weight: 600;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border: none;
        border-radius: 14px;
        color: white;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 16px;
    }

    .speak-btn:hover {
        transform: translateY(-2px);
    }

    .phrase-bank {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .phrase-tag {
        padding: 6px 14px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .phrase-tag:hover {
        border-color: var(--accent);
        background: rgba(99, 102, 241, 0.1);
    }

    .char-count {
        font-size: 11px;
        color: var(--text-muted);
        text-align: right;
        margin-top: 8px;
    }

    .search-input {
        width: 100%;
        padding: 10px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        color: white;
        margin-bottom: 12px;
        font-size: 13px;
    }

    .lang-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
        max-height: 350px;
        overflow-y: auto;
    }

    .lang-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
    }

    .lang-card:hover {
        border-color: var(--glass-border-light);
        background: rgba(99, 102, 241, 0.1);
    }

    .lang-card.selected {
        border-color: var(--accent);
        background: rgba(99, 102, 241, 0.15);
    }

    .lang-flag {
        font-size: 20px;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
    }

    .status-active {
        background: var(--success);
        box-shadow: 0 0 8px var(--success);
        animation: pulse 2s infinite;
    }

    .status-speaking {
        background: var(--accent);
        animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.8); }
    }

    input[type="range"] {
        width: 100%;
        height: 4px;
        background: var(--glass-border);
        border-radius: 2px;
        -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        background: var(--accent);
        border-radius: 50%;
        cursor: pointer;
    }

    @media (max-width: 900px) {
        .tts-grid {
            grid-template-columns: 1fr;
        }
        .main-layout {
            padding: 100px 20px 40px;
        }
        .nav-links {
            display: none;
        }
    }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<nav class="glass-nav">
    <a href="/dashboard" class="nav-logo">
        <div class="dot"></div>
        <span>CommuniSense</span>
    </a>
    <div class="nav-links">
        <a href="/word_recog" class="nav-link">Words</a>
        <a href="/letter_recog" class="nav-link">Letters</a>
        <a href="/number_recog" class="nav-link">Numbers</a>
        <a href="/tts" class="nav-link active">TTS</a>
        <a href="/stt" class="nav-link">STT</a>
        <a href="/games" class="nav-link">Games</a>
        <a href="/dashboard" class="nav-link">Home</a>
    </div>
</nav>

<div class="main-layout">
    <div style="margin-bottom: 40px">
        <span class="section-label">🔊 INSTANT Text to Speech</span>
        <h1 style="font-size: clamp(32px, 4vw, 52px); font-weight: 800;">Text to Speech</h1>
        <p style="color: var(--text-muted); margin-top: 8px;">⚡ Type in ANY language → Choose output language → Speaks INSTANTLY!</p>
    </div>

    <div class="tts-grid">
        <div>
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">📝 Enter Text (Any Language)</span>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn btn-ghost" onclick="clearText()">Clear</button>
                        <button class="btn btn-ghost" onclick="copyText()">Copy</button>
                    </div>
                </div>
                <div class="panel-body">
                    <textarea id="ttsInput" class="big-textarea" rows="5" placeholder="Type anything in any language...&#10;&#10;Example: Hello / नमस्ते / ನಮಸ್ಕಾರ / こんにちは"></textarea>
                    <div class="char-count"><span id="charCount">0</span> characters</div>
                </div>
            </div>

            <div class="panel" style="margin-top: 16px;">
                <div class="panel-header">
                    <span class="panel-title">⚡ Quick Phrases</span>
                </div>
                <div class="panel-body">
                    <div class="phrase-bank" id="phraseBank"></div>
                </div>
            </div>
        </div>

        <div>
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">🎯 Output Language (Speech)</span>
                </div>
                <div class="panel-body">
                    <input type="text" id="langSearch" class="search-input" placeholder="Search language...">
                    <div class="lang-grid" id="langGrid"></div>
                </div>
            </div>

            <div class="panel" style="margin-top: 16px;">
                <div class="panel-header">
                    <span class="panel-title">🎚️ Speed</span>
                </div>
                <div class="panel-body">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span>Speaking Rate</span>
                        <span id="rateValue">1.0x</span>
                    </div>
                    <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1">
                </div>
            </div>

            <button class="speak-btn" onclick="speakNow()">
                🔊 SPEAK NOW (INSTANT)
            </button>
            <button class="speak-btn" style="margin-top: 12px; background: rgba(255,255,255,0.1);" onclick="stopSpeaking()">
                ■ Stop
            </button>

            <div style="display: flex; align-items: center; gap: 8px; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 12px; margin-top: 16px;">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText" style="font-size: 12px;">Ready - Instant!</span>
            </div>
        </div>
    </div>
</div>

<!-- Three.js Background -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('bg-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 15);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 1500;
    const posArray = new Float32Array(particlesCount * 3);
    
    for (let i = 0; i < particlesCount; i++) {
        posArray[i * 3] = (Math.random() - 0.5) * 40;
        posArray[i * 3 + 1] = (Math.random() - 0.5) * 30;
        posArray[i * 3 + 2] = (Math.random() - 0.5) * 30 - 15;
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMaterial = new THREE.PointsMaterial({ size: 0.06, color: 0x6366f1, transparent: true, opacity: 0.4 });
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);
    
    const ambientLight = new THREE.AmbientLight(0x404040);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
    directionalLight.position.set(5, 10, 7);
    scene.add(directionalLight);
    
    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.005;
        particlesMesh.rotation.y = time * 0.1;
        particlesMesh.rotation.x = Math.sin(time * 0.2) * 0.1;
        camera.position.x = Math.sin(time * 0.2) * 0.2;
        camera.position.y = Math.cos(time * 0.15) * 0.1;
        camera.lookAt(0, 0, -5);
        renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

<script>
    // 30+ Languages supported by browser Speech Synthesis
    const LANGUAGES = [
        { name: "English (US)", code: "en-US", flag: "🇺🇸" },
        { name: "English (UK)", code: "en-GB", flag: "🇬🇧" },
        { name: "Hindi", code: "hi-IN", flag: "🇮🇳" },
        { name: "Kannada", code: "kn-IN", flag: "🇮🇳" },
        { name: "Tamil", code: "ta-IN", flag: "🇮🇳" },
        { name: "Telugu", code: "te-IN", flag: "🇮🇳" },
        { name: "Malayalam", code: "ml-IN", flag: "🇮🇳" },
        { name: "Marathi", code: "mr-IN", flag: "🇮🇳" },
        { name: "Gujarati", code: "gu-IN", flag: "🇮🇳" },
        { name: "Punjabi", code: "pa-IN", flag: "🇮🇳" },
        { name: "Bengali", code: "bn-IN", flag: "🇮🇳" },
        { name: "Spanish", code: "es-ES", flag: "🇪🇸" },
        { name: "French", code: "fr-FR", flag: "🇫🇷" },
        { name: "German", code: "de-DE", flag: "🇩🇪" },
        { name: "Italian", code: "it-IT", flag: "🇮🇹" },
        { name: "Portuguese", code: "pt-PT", flag: "🇵🇹" },
        { name: "Russian", code: "ru-RU", flag: "🇷🇺" },
        { name: "Japanese", code: "ja-JP", flag: "🇯🇵" },
        { name: "Korean", code: "ko-KR", flag: "🇰🇷" },
        { name: "Chinese", code: "zh-CN", flag: "🇨🇳" },
        { name: "Arabic", code: "ar-SA", flag: "🇸🇦" },
        { name: "Turkish", code: "tr-TR", flag: "🇹🇷" },
        { name: "Dutch", code: "nl-NL", flag: "🇳🇱" },
        { name: "Polish", code: "pl-PL", flag: "🇵🇱" },
        { name: "Swedish", code: "sv-SE", flag: "🇸🇪" }
    ];

    let selectedLang = LANGUAGES[0];
    let currentUtterance = null;

    function buildLangGrid(langs) {
        const container = document.getElementById('langGrid');
        container.innerHTML = langs.map(lang => `
            <div class="lang-card ${selectedLang.code === lang.code ? 'selected' : ''}" onclick="selectLanguage('${lang.code}')">
                <span class="lang-flag">${lang.flag}</span>
                <span>${lang.name}</span>
            </div>
        `).join('');
    }

    window.selectLanguage = function(code) {
        selectedLang = LANGUAGES.find(l => l.code === code);
        buildLangGrid(LANGUAGES);
    };

    document.getElementById('langSearch').addEventListener('input', (e) => {
        const filtered = LANGUAGES.filter(l => l.name.toLowerCase().includes(e.target.value.toLowerCase()));
        buildLangGrid(filtered);
    });

    const PHRASES = [
        "Hello, how are you?",
        "Thank you very much",
        "Please help me",
        "I need a doctor",
        "Nice to meet you",
        "Goodbye, see you later",
        "I love you",
        "What is your name?"
    ];

    const phraseBank = document.getElementById('phraseBank');
    PHRASES.forEach(phrase => {
        const tag = document.createElement('span');
        tag.className = 'phrase-tag';
        tag.textContent = phrase;
        tag.onclick = () => {
            document.getElementById('ttsInput').value = phrase;
            updateCharCount();
            speakNow();
        };
        phraseBank.appendChild(tag);
    });

    function updateCharCount() {
        const text = document.getElementById('ttsInput').value;
        document.getElementById('charCount').textContent = text.length;
    }

    function clearText() {
        document.getElementById('ttsInput').value = '';
        updateCharCount();
    }

    function copyText() {
        const text = document.getElementById('ttsInput').value;
        if (text) {
            navigator.clipboard.writeText(text);
            showToast('Copied!');
        }
    }

    function speakNow() {
        let text = document.getElementById('ttsInput').value.trim();
        if (!text) {
            showToast('Please enter some text');
            return;
        }

        const rate = parseFloat(document.getElementById('rateSlider').value);
        
        setStatus('Speaking...', 'speaking');
        
        // Stop any ongoing speech
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
        }
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = selectedLang.code;
        utterance.rate = rate;
        
        utterance.onstart = () => {
            console.log("🔊 Speaking in", selectedLang.name);
        };
        
        utterance.onend = () => {
            setStatus('Ready', 'active');
            currentUtterance = null;
        };
        
        utterance.onerror = (e) => {
            console.error('Speech error:', e);
            setStatus('Error - Try different language', 'active');
            showToast('Speech error. Try a different language.');
            currentUtterance = null;
        };
        
        currentUtterance = utterance;
        window.speechSynthesis.speak(utterance);
    }

    function stopSpeaking() {
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
        }
        currentUtterance = null;
        setStatus('Stopped', 'active');
    }

    function setStatus(msg, type) {
        document.getElementById('statusText').textContent = msg;
        const dot = document.getElementById('statusDot');
        dot.className = 'status-dot';
        if (type === 'active') dot.classList.add('status-active');
        else if (type === 'speaking') dot.classList.add('status-speaking');
    }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.textContent = msg;
        toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:white;padding:10px 20px;border-radius:10px;z-index:1000;font-size:14px;';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    document.getElementById('rateSlider').addEventListener('input', (e) => {
        document.getElementById('rateValue').textContent = e.target.value + 'x';
    });

    document.getElementById('ttsInput').addEventListener('input', updateCharCount);

    buildLangGrid(LANGUAGES);
    updateCharCount();
    setStatus('Ready - Instant!', 'active');
</script>
</body>
</html>
