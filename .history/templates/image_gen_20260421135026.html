<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Generator — CommBridge</title>
<link rel="stylesheet" href="/static/base.css">
<style>
/* Additional styles for image generator */
.image-gen-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
}

.gen-panel {
    background: var(--surface, #1a1a1a);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.prompt-area {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    border: 2px solid var(--border, #333);
    border-radius: 12px;
    background: var(--bg, #0a0a0a);
    color: var(--text, #fff);
    resize: vertical;
    min-height: 120px;
    margin-bottom: 20px;
    font-family: inherit;
}

.prompt-area:focus {
    outline: none;
    border-color: var(--accent, #667eea);
}

.generate-btn {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--accent, #667eea), var(--accent2, #764ba2));
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
    margin-bottom: 20px;
}

.generate-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
}

.generate-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.loading-container {
    display: none;
    text-align: center;
    padding: 30px;
    background: var(--surface2, #111);
    border-radius: 12px;
    margin: 20px 0;
}

.loading-container.active {
    display: block;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 3px solid rgba(102, 126, 234, 0.1);
    border-top-color: var(--accent, #667eea);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    margin: 20px 0;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent, #667eea), var(--accent2, #764ba2));
    border-radius: 3px;
    width: 0%;
    transition: width 0.3s ease;
}

.timer {
    font-size: 16px;
    color: var(--text-dim, #888);
    margin-top: 15px;
    font-family: monospace;
}

.status-message {
    color: var(--text-dim, #888);
    margin-top: 10px;
    font-size: 14px;
}

.error-message {
    display: none;
    padding: 16px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid #ef4444;
    border-radius: 12px;
    color: #ef4444;
    margin: 20px 0;
}

.error-message.show {
    display: block;
}

.result-container {
    display: none;
    margin-top: 30px;
    text-align: center;
}

.result-container.show {
    display: block;
}

.result-image {
    max-width: 100%;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    margin-bottom: 20px;
}

.image-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
}

.action-btn {
    padding: 12px 24px;
    background: var(--surface2, #222);
    border: 1px solid var(--border, #444);
    border-radius: 8px;
    color: var(--text, #fff);
    cursor: pointer;
    transition: all 0.3s;
    font-size: 14px;
}

.action-btn:hover {
    background: var(--accent, #667eea);
    border-color: var(--accent, #667eea);
}

.quick-prompts {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.quick-prompt {
    padding: 8px 16px;
    background: var(--surface2, #222);
    border: 1px solid var(--border, #444);
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.3s;
    color: var(--text-dim, #aaa);
}

.quick-prompt:hover {
    background: var(--accent, #667eea);
    color: white;
    border-color: var(--accent, #667eea);
}

.prompt-info {
    font-size: 13px;
    color: var(--text-dim, #888);
    margin-top: 10px;
    text-align: right;
}
</style>
</head>
<body>
<div class="image-gen-container">
    <div class="gen-panel">
        <h1 style="margin-bottom: 10px; font-size: 32px;">🎨 AI Image Generator</h1>
        <p style="color: var(--text-dim, #888); margin-bottom: 30px;">
            Generate stunning images from text descriptions
        </p>
        
        <!-- Quick Prompts -->
        <div class="quick-prompts">
            <span class="quick-prompt" onclick="setPrompt('Beautiful sunset over mountains with golden light')">🌅 Sunset</span>
            <span class="quick-prompt" onclick="setPrompt('Futuristic city with flying cars and neon lights')">🏙️ Cyberpunk</span>
            <span class="quick-prompt" onclick="setPrompt('Cute magical creature in enchanted forest')">✨ Fantasy</span>
            <span class="quick-prompt" onclick="setPrompt('Serene ocean waves at sunrise')">🌊 Ocean</span>
            <span class="quick-prompt" onclick="setPrompt('Abstract colorful geometric patterns')">🎨 Abstract</span>
        </div>
        
        <!-- Prompt Input -->
        <textarea 
            id="prompt" 
            class="prompt-area" 
            placeholder="Describe the image you want to generate..."
        ></textarea>
        <div class="prompt-info" id="charCount">0 / 500 characters</div>
        
        <!-- Generate Button -->
        <button onclick="generateImage()" id="generateBtn" class="generate-btn">
            <span id="btnText">✨ Generate Image</span>
        </button>
        
        <!-- Loading State -->
        <div id="loadingContainer" class="loading-container">
            <div class="spinner"></div>
            <div class="status-message" id="statusMessage">Initializing AI model...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="timer" id="timer">0:00</div>
            <p style="color: var(--text-dim, #888); margin-top: 20px; font-size: 13px;">
                ⏱️ Image generation typically takes 45-60 seconds<br>
                Please be patient while we create your masterpiece
            </p>
        </div>
        
        <!-- Error Message -->
        <div id="errorMessage" class="error-message"></div>
        
        <!-- Result -->
        <div id="resultContainer" class="result-container">
            <img id="generatedImage" class="result-image" alt="Generated Image">
            <div class="image-actions">
                <button onclick="downloadImage()" class="action-btn">⬇️ Download</button>
                <button onclick="copyToClipboard()" class="action-btn">📋 Copy</button>
                <button onclick="generateAgain()" class="action-btn">🔄 Generate Again</button>
            </div>
        </div>
    </div>
</div>

<script>
let currentImageData = null;
let currentPrompt = '';
let timerInterval = null;
let startTime = null;
let progressInterval = null;

// Character counter
document.getElementById('prompt').addEventListener('input', function(e) {
    const count = e.target.value.length;
    document.getElementById('charCount').textContent = `${count} / 500 characters`;
});

// Set prompt from quick prompts
function setPrompt(text) {
    document.getElementById('prompt').value = text;
    document.getElementById('charCount').textContent = `${text.length} / 500 characters`;
}

// Start timer
function startTimer() {
    startTime = Date.now();
    timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const minutes = Math.floor(elapsed / 60);
        const seconds = elapsed % 60;
        document.getElementById('timer').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        
        // Update status message based on time
        const statusMsg = document.getElementById('statusMessage');
        if (elapsed < 10) {
            statusMsg.textContent = '🎯 Processing your prompt...';
        } else if (elapsed < 25) {
            statusMsg.textContent = '🤖 AI is working on your image...';
        } else if (elapsed < 40) {
            statusMsg.textContent = '🎨 Adding final details...';
        } else {
            statusMsg.textContent = '✨ Almost there! Finalizing...';
        }
    }, 1000);
}

// Stop timer
function stopTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
    if (progressInterval) {
        clearInterval(progressInterval);
        progressInterval = null;
    }
}

// Update progress bar
function startProgress() {
    const progressFill = document.getElementById('progressFill');
    let width = 0;
    progressInterval = setInterval(() => {
        if (width < 90) {
            width += 2;
            progressFill.style.width = width + '%';
        }
    }, 1000);
}

// Complete progress
function completeProgress() {
    const progressFill = document.getElementById('progressFill');
    progressFill.style.width = '100%';
}

// Generate image
async function generateImage() {
    const prompt = document.getElementById('prompt').value.trim();
    
    if (!prompt) {
        showError('Please enter a prompt');
        return;
    }
    
    if (prompt.length > 500) {
        showError('Prompt must be 500 characters or less');
        return;
    }
    
    currentPrompt = prompt;
    
    // Reset UI
    document.getElementById('generateBtn').disabled = true;
    document.getElementById('btnText').textContent = '🎨 Generating...';
    document.getElementById('loadingContainer').classList.add('active');
    document.getElementById('resultContainer').classList.remove('show');
    document.getElementById('errorMessage').classList.remove('show');
    
    // Reset progress
    const progressFill = document.getElementById('progressFill');
    progressFill.style.width = '0%';
    document.getElementById('statusMessage').textContent = 'Initializing AI model...';
    
    // Start timer and progress
    startTimer();
    startProgress();
    
    try {
        // Call Flask backend
        const response = await fetch('/api/image_gen', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ prompt: prompt })
        });
        
        const data = await response.json();
        
        if (data.success) {
            // Complete progress
            completeProgress();
            document.getElementById('statusMessage').textContent = '✅ Image generated successfully!';
            
            // Display image
            const img = document.getElementById('generatedImage');
            img.src = 'data:image/jpeg;base64,' + data.image;
            currentImageData = data.image;
            
            // Show result after a short delay
            setTimeout(() => {
                document.getElementById('loadingContainer').classList.remove('active');
                document.getElementById('resultContainer').classList.add('show');
            }, 500);
            
        } else {
            throw new Error(data.error || 'Generation failed');
        }
    } catch (error) {
        stopTimer();
        document.getElementById('loadingContainer').classList.remove('active');
        showError('Generation failed: ' + error.message);
    } finally {
        stopTimer();
        document.getElementById('generateBtn').disabled = false;
        document.getElementById('btnText').textContent = '✨ Generate Image';
    }
}

// Download image
function downloadImage() {
    if (!currentImageData) return;
    
    const link = document.createElement('a');
    link.download = `ai-image-${Date.now()}.jpg`;
    link.href = 'data:image/jpeg;base64,' + currentImageData;
    link.click();
}

// Copy to clipboard
async function copyToClipboard() {
    if (!currentImageData) return;
    
    try {
        const blob = await (await fetch('data:image/jpeg;base64,' + currentImageData)).blob();
        await navigator.clipboard.write([
            new ClipboardItem({
                [blob.type]: blob
            })
        ]);
        alert('✅ Image copied to clipboard!');
    } catch (error) {
        alert('❌ Failed to copy image');
    }
}

// Generate again
function generateAgain() {
    document.getElementById('resultContainer').classList.remove('show');
    document.getElementById('generateBtn').click();
}

// Show error
function showError(message) {
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.textContent = '❌ ' + message;
    errorDiv.classList.add('show');
}

// Keyboard shortcut (Ctrl/Cmd + Enter)
document.getElementById('prompt').addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        generateImage();
    }
});

// Add example prompt on load if empty
window.addEventListener('load', function() {
    if (!document.getElementById('prompt').value) {
        setPrompt('Beautiful sunset over mountains with golden light reflecting on a calm lake');
    }
});
</script>
</body>
</html>
