<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignSense — ASL Dictionary</title>
<link rel="stylesheet" href="/static/base.css">
<style>
.dictionary-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 100px 20px 60px;
}

.search-section {
  max-width: 600px;
  margin: 0 auto 50px;
}

.search-box {
  position: relative;
}

.search-input {
  width: 100%;
  padding: 20px 20px 20px 60px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 20px;
  color: var(--text);
  font-size: 18px;
  transition: all 0.3s;
}

.search-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(79, 139, 255, 0.1);
}

.search-icon {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
  font-size: 24px;
}

.sign-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 25px;
}

.sign-card {
  background: linear-gradient(145deg, var(--surface), var(--surface2));
  border: 2px solid var(--border);
  border-radius: 24px;
  padding: 30px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
}

.sign-card:hover {
  transform: translateY(-8px) scale(1.02);
  border-color: var(--accent);
  box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 30px rgba(79, 139, 255, 0.2);
}

.sign-hand {
  font-size: 80px;
  margin-bottom: 20px;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2));
  animation: float 3s ease-in-out infinite;
}

.sign-word {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 10px;
  color: var(--text);
}

.sign-description {
  font-size: 14px;
  color: var(--accent2);
  margin-bottom: 15px;
  font-weight: 600;
}

.sign-tip {
  background: rgba(79, 139, 255, 0.1);
  padding: 12px;
  border-radius: 12px;
  font-size: 13px;
  color: var(--text2);
  border-left: 3px solid var(--accent);
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(10px);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: all;
}

.modal-content {
  background: linear-gradient(145deg, var(--surface), var(--surface2));
  border-radius: 32px;
  padding: 50px;
  max-width: 500px;
  width: 90%;
  text-align: center;
  transform: scale(0.9);
  transition: transform 0.3s;
}

.modal-overlay.active .modal-content {
  transform: scale(1);
}

.modal-hand {
  font-size: 150px;
  margin-bottom: 30px;
  animation: float 3s ease-in-out infinite;
}

.modal-word {
  font-size: 48px;
  font-weight: 800;
  margin-bottom: 20px;
}

.modal-desc {
  font-size: 20px;
  color: var(--accent2);
  margin-bottom: 20px;
}

.modal-tip {
  background: rgba(79, 139, 255, 0.15);
  padding: 20px;
  border-radius: 16px;
  margin: 30px 0;
  border-left: 4px solid var(--accent);
}

.modal-actions {
  display: flex;
  gap: 15px;
  justify-content: center;
}

.category-tabs {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 30px 0;
  flex-wrap: wrap;
}

.category-tab {
  padding: 10px 20px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 30px;
  cursor: pointer;
  transition: all 0.3s;
}

.category-tab:hover,
.category-tab.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.result-count {
  text-align: center;
  margin-bottom: 20px;
  color: var(--text2);
}
</style>
</head>
<body>
<div class="page-wrap">
  <nav class="nav">
    <a href="/dashboard" class="nav-logo"><div class="logo-dot"></div>CommuniSense</a>
    <div class="nav-links">
      <a href="/tts" class="nav-link">TTS</a>
      <a href="/stt" class="nav-link">STT</a>
      <a href="/word_recog" class="nav-link">Words</a>
      <a href="/image_gen" class="nav-link">AI Art</a>
      <a href="/emotion_translate" class="nav-link">Emotion</a>
      <a href="/visual_alert" class="nav-link">Alerts</a>
      <a href="/sign_dictionary" class="nav-link active">Signs</a>
      <a href="/mood_journal" class="nav-link">Journal</a>
      <a href="/lip_sync" class="nav-link">LipSync</a>
    </div>
    <div class="nav-actions">
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Sign Out</button>
    </div>
  </nav>

  <!-- Modal -->
  <div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal-content">
      <div class="modal-hand" id="modalHand"></div>
      <div class="modal-word" id="modalWord"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-tip" id="modalTip"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="speakCurrentWord()">🔊 Hear It</button>
        <button class="btn btn-secondary" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <div class="dictionary-container">
    <div style="text-align: center; margin-bottom: 40px;">
      <span class="badge badge-accent">🤟 ASL VISUAL DICTIONARY</span>
      <h1 style="font-size: 48px; margin: 20px 0 10px;">Sign Language Dictionary</h1>
      <p style="color: var(--text2); font-size: 18px;">Learn American Sign Language with visual guides and step-by-step instructions</p>
    </div>

    <div class="search-section">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Search for a sign... (hello, thanks, help, love...)" oninput="searchSigns(this.value)">
      </div>
    </div>

    <div class="category-tabs" id="categoryTabs">
      <span class="category-tab active" onclick="filterCategory('all')">All Signs</span>
      <span class="category-tab" onclick="filterCategory('greetings')">Greetings</span>
      <span class="category-tab" onclick="filterCategory('actions')">Actions</span>
      <span class="category-tab" onclick="filterCategory('family')">Family</span>
      <span class="category-tab" onclick="filterCategory('everyday')">Everyday</span>
    </div>

    <div class="result-count" id="resultCount"></div>
    
    <div class="sign-grid" id="signGrid"></div>
  </div>
</div>

<script src="/static/app.js"></script>
<script>
let allSigns = {};
let currentWord = '';

async function loadSigns(query = '') {
  try {
    const url = query ? `/api/sign_dictionary?q=${encodeURIComponent(query)}` : '/api/sign_dictionary';
    const data = await apiFetch(url, { method: 'GET' });
    allSigns = data.results;
    renderSigns(allSigns);
  } catch(e) {
    console.error('Failed to load signs');
  }
}

function renderSigns(signs) {
  const entries = Object.entries(signs);
  document.getElementById('resultCount').textContent = `Showing ${entries.length} sign${entries.length !== 1 ? 's' : ''}`;
  
  const grid = document.getElementById('signGrid');
  if (entries.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:60px; color:var(--text3);">No signs found. Try another word.</div>';
    return;
  }
  
  grid.innerHTML = entries.map(([word, info]) => `
    <div class="sign-card" onclick="openModal('${word}')">
      <div class="sign-hand">${info.hand}</div>
      <div class="sign-word">${capitalize(word)}</div>
      <div class="sign-description">${info.gif_desc}</div>
      <div class="sign-tip">💡 ${info.tip}</div>
    </div>
  `).join('');
}

function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

function openModal(word) {
  const info = allSigns[word];
  if (!info) return;
  
  currentWord = word;
  
  document.getElementById('modalHand').textContent = info.hand;
  document.getElementById('modalWord').textContent = capitalize(word);
  document.getElementById('modalDesc').textContent = info.gif_desc;
  document.getElementById('modalTip').textContent = `💡 Tip: ${info.tip}`;
  
  document.getElementById('modal').classList.add('active');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('active');
  }
}

async function speakCurrentWord() {
  try {
    const data = await apiFetch('/api/tts', {
      method: 'POST',
      body: JSON.stringify({ text: currentWord, lang: 'en' })
    });
    if (data.audio) playAudio(data.audio);
  } catch(e) {}
}

let searchTimer;
function searchSigns(query) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadSigns(query), 300);
}

function filterCategory(category) {
  document.querySelectorAll('.category-tab').forEach(tab => {
    tab.classList.remove('active');
  });
  event.target.classList.add('active');
  
  // Category filtering logic
  const categories = {
    greetings: ['hello', 'good', 'thank you', 'please', 'sorry'],
    actions: ['eat', 'help', 'stop', 'more'],
    family: ['mother', 'father', 'friend', 'love'],
    everyday: ['water', 'home', 'school', 'yes', 'no']
  };
  
  if (category === 'all') {
    renderSigns(allSigns);
  } else {
    const filtered = {};
    categories[category]?.forEach(word => {
      if (allSigns[word]) filtered[word] = allSigns[word];
    });
    renderSigns(filtered);
  }
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === '/' && !e.target.matches('input')) {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

// Load signs on page load
loadSigns();
</script>
</body>
</html>
